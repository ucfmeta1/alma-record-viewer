<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Alma Linked Data Preview</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f4f6f9; color: #333; }
        .card { background: #fff; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 800px; margin: auto; }
        h1 { font-size: 22px; color: #003366; margin-top: 0; line-height: 1.4; }
        .field { margin-bottom: 18px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .label { font-weight: bold; color: #555; display: inline-block; width: 140px; }
        .value { color: #222; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul { margin: 5px 0 0 140px; padding-left: 0; list-style-type: disc; }
        li { margin-bottom: 5px; color: #444; }
    </style>
</head>
<body>
    <div class="card">
        <h1 id="title">Loading Alma Linked Data...</h1>
        
        <div class="field">
            <span class="label">Creator:</span> 
            <span class="value" id="creator">Loading...</span>
        </div>
        
        <div class="field">
            <span class="label">Date:</span> 
            <span class="value" id="date">Loading...</span>
        </div>
        
        <div class="field">
            <span class="label">Place:</span> 
            <span class="value" id="place">Loading...</span>
        </div>
        
        <div class="field">
            <span class="label">Subjects:</span> 
            <ul id="subjects"></ul>
        </div>
        
        <div class="field" style="border-bottom: none;">
            <span class="label">Notes:</span> 
            <ul id="notes"></ul>
        </div>
    </div>

    <script>
        // Alma real-time JSON-LD public endpoint URL
        const jsonLdUrl = 'https://open-na.hosted.exlibrisgroup.com/alma/01FALSC_NETWORK/bibs/9916025436306561.jsonld';

        fetch(jsonLdUrl)
            .then(response => response.json())
            .then(data => {
                // Populate Title
                document.getElementById('title').innerText = data.title || 'Untitled';
                
                // Populate Creator and link
                if (data.creator) {
                    document.getElementById('creator').innerHTML = `<a href="${data.creator['@id']}" target="_blank">${data.creator.label}</a>`;
                } else {
                    document.getElementById('creator').innerText = 'None';
                }
                
                // Populate Date and Place of Publication
                document.getElementById('date').innerText = data.date || 'None';
                document.getElementById('place').innerText = data.place_of_publication || 'None';
                
                // Populate Subjects
                if (data.subject) {
                    const subList = document.getElementById('subjects');
                    subList.innerHTML = '';
                    data.subject.forEach(sub => {
                        const li = document.createElement('li');
                        li.innerText = sub.label;
                        subList.appendChild(li);
                    });
                }
                
                // Populate Notes
                if (data.note) {
                    const noteList = document.getElementById('notes');
                    noteList.innerHTML = '';
                    data.note.forEach(note => {
                        const li = document.createElement('li');
                        li.innerText = note;
                        noteList.appendChild(li);
                    });
                }
            })
            .catch(error => {
                document.getElementById('title').innerText = 'Failed to load linked data.';
                console.error('Error:', error);
            });
    </script>
</body>
</html>
