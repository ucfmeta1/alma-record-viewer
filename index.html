<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Universal Alma Linked Data Viewer</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 40px; background: #f4f6f9; color: #333; }
        .card { background: #fff; padding: 35px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); max-width: 850px; margin: auto; }
        h1 { font-size: 22px; color: #003366; margin-top: 0; line-height: 1.4; }
        .field { margin-bottom: 18px; border-bottom: 1px solid #eee; padding-bottom: 12px; }
        .label { font-weight: bold; color: #555; display: inline-block; width: 150px; vertical-align: top; }
        .value { color: #222; display: inline-block; max-width: 650px; word-break: break-word; }
        a { color: #0066cc; text-decoration: none; }
        a:hover { text-decoration: underline; }
        ul { margin: 0; padding-left: 20px; }
        li { margin-bottom: 8px; color: #444; }
        .search-box { margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid #003366; }
        input[type="text"] { width: 68%; padding: 8px; font-size: 14px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; background: #003366; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 14px; }
        button:hover { background: #002244; }
        .uri-badge { display: inline-block; background: #eef4fa; color: #0066cc; border: 1px solid #bcdcda; border-radius: 3px; padding: 2px 7px; font-size: 11px; margin-left: 5px; margin-top: 3px; font-weight: 500; }
        .uri-badge:hover { background: #0066cc; color: white; }
    </style>
</head>
<body>
    <div class="card">
        <div class="search-box">
            <label class="label" for="mmsInput" style="width: 100px;">MMS ID:</label>
            <input type="text" id="mmsInput" placeholder="Enter MMS ID (e.g., 9916025317006561)">
            <button onclick="loadRecord()">View Record</button>
        </div>

        <h1 id="title">Please enter an MMS ID or select a record.</h1>
        
        <div class="field">
            <span class="label">Creator (100):</span> 
            <span class="value" id="creator">-</span>
        </div>
        
        <div class="field">
            <span class="label">Contributor (700):</span> 
            <span class="value"><ul id="contributor" style="list-style-type: none; padding: 0; margin: 0;"><li>-</li></ul></span>
        </div>

        <div class="field">
            <span class="label">Date (264):</span> 
            <span class="value" id="date">-</span>
        </div>
        
        <div class="field">
            <span class="label">Place (264):</span> 
            <span class="value" id="place">-</span>
        </div>
        
        <div class="field">
            <span class="label">Subjects & Places (6xx):</span> 
            <span class="value"><ul id="subjects"><li>-</li></ul></span>
        </div>
        
        <div class="field">
            <span class="label">Digital Access (856):</span> 
            <span class="value" id="digitalAccess">-</span>
        </div>

        <div class="field" style="border-bottom: none;">
            <span class="label">Notes (5xx):</span> 
            <span class="value"><ul id="notes"><li>-</li></ul></span>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mmsParam = urlParams.get('mms');
        
        if (mmsParam) {
            document.getElementById('mmsInput').value = mmsParam;
            fetchAndRender(mmsParam);
        } else {
            document.getElementById('mmsInput').value = '9916025317006561';
            fetchAndRender('9916025317006561');
        }

        function loadRecord() {
            const mmsId = document.getElementById('mmsInput').value.trim();
            if (mmsId) {
                window.history.pushState({}, '', `?mms=${mmsId}`);
                fetchAndRender(mmsId);
            } else {
                alert('Please enter a valid MMS ID.');
            }
        }

        function extractURIs(obj, foundURIs = new Set()) {
            if (!obj) return foundURIs;
            if (typeof obj === 'string') {
                if (obj.startsWith('http://') || obj.startsWith('https://')) {
                    foundURIs.add(obj);
                }
            } else if (Array.isArray(obj)) {
                obj.forEach(item => extractURIs(item, foundURIs));
            } else if (typeof obj === 'object') {
                for (let key in obj) {
                    if (key !== '@type') {
                        extractURIs(obj[key], foundURIs);
                    }
                }
            }
            return foundURIs;
        }

        function formatLinkedEntity(entity) {
            if (!entity) return 'None';
            let label = entity.label || entity['rdfs:label'] || entity.name || (typeof entity === 'string' ? entity : 'Entity');
            
            const urisSet = extractURIs(entity);
            let linksHtml = '';

            urisSet.forEach(uri => {
                let domain = 'URI';
                if (uri.includes('viaf.org')) domain = 'VIAF';
                else if (uri.includes('wikidata.org')) domain = 'Wikidata';
                else if (uri.includes('id.loc.gov')) domain = 'LCNAF / LCSH';
                else if (uri.includes('geonames.org')) domain = 'GeoNames';
                else if (uri.includes('fast.oclc.org')) domain = 'FAST';
                else if (uri.includes('isni.org')) domain = 'ISNI';
                else if (uri.includes('getty.edu')) domain = 'AAT / TGN';

                linksHtml += ` <a href="${uri}" target="_blank" class="uri-badge">${domain}</a>`;
            });

            return `<span>${label}</span>${linksHtml}`;
        }

        function fetchAndRender(mmsId) {
            const jsonLdUrl = `https://open-na.hosted.exlibrisgroup.com/alma/01FALSC_NETWORK/bibs/${mmsId}.jsonld`;
            
            document.getElementById('title').innerText = 'Loading Linked Data...';
            
            fetch(jsonLdUrl)
                .then(response => {
                    if (!response.ok) throw new Error('Record not found');
                    return response.json();
                })
                .then(data => {
                    document.getElementById('title').innerText = data.title || 'Untitled';
                    
                    // Creator (100)
                    let creators = [];
                    if (data.creator) {
                        creators = Array.isArray(data.creator) ? data.creator : [data.creator];
                    }
                    document.getElementById('creator').innerHTML = creators.length > 0 ? formatLinkedEntity(creators[0]) : 'None';

                    // Contributor (700) - check multiple possible JSON-LD properties
                    const contribList = document.getElementById('contributor');
                    contribList.innerHTML = '';
                    let contributors = [];
                    if (data.contributor) {
                        contributors = Array.isArray(data.contributor) ? data.contributor : [data.contributor];
                    } else if (data.contribution) {
                        contributors = Array.isArray(data.contribution) ? data.contribution : [data.contribution];
                    } else if (creators.length > 1) {
                        contributors = creators.slice(1); // fallback if multiple creators
                    }

                    if (contributors.length > 0) {
                        contributors.forEach(c => {
                            const li = document.createElement('li');
                            li.innerHTML = formatLinkedEntity(c);
                            contribList.appendChild(li);
                        });
                    } else {
                        contribList.innerHTML = '<li>None</li>';
                    }

                    document.getElementById('date').innerText = data.date || 'None';
                    document.getElementById('place').innerText = data.place_of_publication || 'None';
                    
                    // Digital Access (856)
                    if (data.isPartOf || data.url) {
                        const digitalUrl = data.url || data.isPartOf;
                        document.getElementById('digitalAccess').innerHTML = `<a href="${digitalUrl}" target="_blank">${digitalUrl}</a>`;
                    } else {
                        document.getElementById('digitalAccess').innerText = 'None';
                    }

                    // Subjects & Places (6xx)
                    const subList = document.getElementById('subjects');
                    subList.innerHTML = '';
                    let allSubjects = [];
                    if (data.subject) allSubjects.push(...(Array.isArray(data.subject) ? data.subject : [data.subject]));
                    if (data.spatial) allSubjects.push(...(Array.isArray(data.spatial) ? data.spatial : [data.spatial]));

                    if (allSubjects.length > 0) {
                        allSubjects.forEach(sub => {
                            const li = document.createElement('li');
                            li.innerHTML = formatLinkedEntity(sub);
                            subList.appendChild(li);
                        });
                    } else {
                        subList.innerHTML = '<li>None</li>';
                    }
                    
                    // Notes
                    const noteList = document.getElementById('notes');
                    noteList.innerHTML = '';
                    if (data.note) {
                        const notes = Array.isArray(data.note) ? data.note : [data.note];
                        notes.forEach(note => {
                            const li = document.createElement('li');
                            li.innerText = typeof note === 'string' ? note : note.label;
                            noteList.appendChild(li);
                        });
                    } else {
                        noteList.innerHTML = '<li>None</li>';
                    }
                })
                .catch(error => {
                    document.getElementById('title').innerText = 'Failed to load record. Please check the MMS ID.';
                    console.error('Error:', error);
                });
        }
    </script>
</body>
</html>
